<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Locked</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14'%3E%F0%9F%8F%B7%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-panel">
    <h1>password, please</h1>
    <form id="gate-form">
      <input type="password" id="password" autocomplete="current-password" aria-label="Password" autofocus />
      <button type="submit" class="button" id="gate-submit">Enter</button>
      <span id="gate-error" class="error"></span>
    </form>
  </div>
  <script>
    // Deliberately not a module and with no imports: this page is one of the
    // two things CloudFront serves without signed cookies, so it has to stand
    // on its own.
    const form = document.getElementById('gate-form');
    const input = document.getElementById('password');
    const submit = document.getElementById('gate-submit');
    const error = document.getElementById('gate-error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
        });
        if (response.ok) {
          // The cookies are set; go to wherever they were headed.
          const target = new URLSearchParams(location.search).get('next');
          location.replace(target && target.startsWith('/') ? target : '/');
          return;
        }
        const payload = await response.json().catch(() => ({}));
        error.textContent = payload.error || 'That did not work.';
      } catch (err) {
        error.textContent = 'Could not reach the site. Try again.';
      }
      submit.disabled = false;
      input.select();
    });
  </script>
</body>
</html>
